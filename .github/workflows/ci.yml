name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Android instrumented tests (§17.5) are NOT here — they need an emulator and
# live in android-ui-tests.yml, which records the screen while they run.
#
# §17.5b's release-build checks land with M7:
#   - dependency-set-parity between flavours runs inside `./gradlew check`
#     (checkFlavourDependencyParity, androidApp/build.gradle.kts) alongside
#     the manifest-diff and licence-allowlist checks, all three in the
#     `check` job below.
#   - assembleFossRelease/assemblePlayRelease succeeding is exercised by the
#     `check` job too. No real signing key is required for either — both
#     flavours' release build types are wired to sign with the owner's key
#     only when keystore.properties/env vars supply one (§15.4); absent
#     that, the release APK builds unsigned, which is sufficient for these
#     checks (the reproducibility check below explicitly excludes the
#     signing block from its comparison).
#   - the reproducibility check (two clean fossRelease builds, byte-identical
#     excluding the signing block) is its own job below — it does two full
#     clean builds and would otherwise double the main job's runtime.
jobs:
  check:
    name: Build & check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The build derives its version from the latest release tag via
          # `git describe` (root build.gradle.kts), so the tags have to be here.
          # Without them every build silently falls back to the untagged
          # 0.0.0-dev/versionCode 1 placeholder.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform & build-tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # §17.5's desktop half needs a session bus with something answering
      # org.freedesktop.Notifications, and a real notify-send to reach it
      # with. `dbus-run-session` (dbus-x11) provides the bus,
      # tools/ci/mock-notification-daemon.py stands in for the daemon a
      # headless runner has no desktop environment to supply, and libnotify's
      # notify-send is what the app actually spawns (§10.3). Without these
      # DesktopNotifierBackendTest's end-to-end case skips itself rather than
      # failing, so this step is what turns it into real coverage.
      - name: Install the desktop notification test harness
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y dbus-x11 libnotify-bin
          python3 -m pip install --user "jeepney==0.9.0"

      # commonTest on JVM (which since M6 includes the desktop app's own
      # tests, §17), both flavours assemble, manifest-diff and
      # licence-allowlist checks (§17.5b). Later milestones extend this job
      # rather than replace it — see §17 for the full testing strategy.
      #
      # Run under a private session bus with the mock notification daemon on
      # it. `dbus-run-session` tears the bus down when the command finishes,
      # which is also how the daemon exits.
      - name: Check (commonTest, lint, manifest parity, dependency licences)
        env:
          SKYWARD_MOCK_NOTIFICATION_LOG: ${{ runner.temp }}/mock-notifications.jsonl
        run: |
          dbus-run-session -- bash -c '
            python3 tools/ci/mock-notification-daemon.py > "$RUNNER_TEMP/mock-daemon.log" &
            for _ in $(seq 1 100); do
              grep -q ready "$RUNNER_TEMP/mock-daemon.log" && break
              sleep 0.1
            done
            grep -q ready "$RUNNER_TEMP/mock-daemon.log" ||
              { echo "mock notification daemon never came up:"; cat "$RUNNER_TEMP/mock-daemon.log"; exit 1; }
            ./gradlew check --stacktrace
          '

      - name: Assemble both Android flavours (debug)
        run: ./gradlew :androidApp:assembleFossDebug :androidApp:assemblePlayDebug --stacktrace

      - name: Compile desktop app
        run: ./gradlew :desktopApp:compileKotlin --stacktrace

      # §18/M6 accept: "runs under Flatpak locally". CI does not run
      # flatpak-builder — it builds the tree the manifest repackages
      # (flatpak/dev.fritze.Skyward.yml), which is the only build that
      # exercises jlink's module set and the packaging config. A missing JDK
      # module (java.sql, jdk.crypto.ec) compiles perfectly and then dies on
      # first launch, so compiling alone would not catch it. The Flatpak build
      # itself stays a local/release step.
      - name: Build the self-contained desktop distributable
        run: ./gradlew :desktopApp:createReleaseDistributable --stacktrace

      # Runs the packaged binary rather than the Gradle classpath: this is the
      # startup path that a packaging mistake actually breaks (see ADR 0007).
      - name: Smoke-test the packaged binary
        run: |
          desktopApp/build/compose/binaries/main-release/app/skyward/bin/skyward debug-matches \
            | tee /tmp/debug-matches.txt
          grep -q "occurrences in horizon" /tmp/debug-matches.txt

      - name: Assemble both Android flavours (release)
        run: ./gradlew :androidApp:assembleFossRelease :androidApp:assemblePlayRelease --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          retention-days: 14
          if-no-files-found: ignore

  # §15.4/§17.5b: two clean fossRelease builds must be byte-identical
  # (excluding the signing block) — this is what makes F-Droid's own rebuild
  # able to verify and republish the developer-signed APK. A separate job
  # because tools/ci/check-reproducible-build.sh does two full clean builds
  # on its own; folding it into `check` above would double that job's time.
  reproducible-build:
    name: fossRelease reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # As in the `check` job — and it matters more here: this job stands in
          # for F-Droid's rebuild, which builds from a tag. Without the tags the
          # version this job reproduces is the untagged fallback, not the one a
          # release actually ships.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform & build-tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build fossRelease twice and diff (excluding the signing block)
        run: tools/ci/check-reproducible-build.sh
