name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Android instrumented tests (§17.5) are NOT here — they need an emulator and
# live in android-ui-tests.yml, which records the screen while they run.
#
# §17.5b's release-build checks (assembleFossRelease / assemblePlayRelease,
# reproducibility diffoscope diff, dependency-set-parity between flavours)
# need a real signing config and land with M7.
jobs:
  check:
    name: Build & check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform & build-tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # commonTest on JVM (which since M6 includes the desktop app's own
      # tests, §17), both flavours assemble, manifest-diff and
      # licence-allowlist checks (§17.5b). Later milestones extend this job
      # rather than replace it — see §17 for the full testing strategy.
      - name: Check (commonTest, lint, manifest parity, dependency licences)
        run: ./gradlew check --stacktrace

      - name: Assemble both Android flavours (debug)
        run: ./gradlew :androidApp:assembleFossDebug :androidApp:assemblePlayDebug --stacktrace

      - name: Compile desktop app
        run: ./gradlew :desktopApp:compileKotlin --stacktrace

      # §18/M6 accept: "runs under Flatpak locally". Flatpak packages exactly
      # this tree (flatpak/dev.fritze.Skyward.yml), and it is the only build
      # that exercises jlink's module set and the packaging config — a missing
      # JDK module (java.sql, jdk.crypto.ec) compiles perfectly and then dies
      # on first launch, so compiling alone would not catch it.
      - name: Build the self-contained desktop distributable
        run: ./gradlew :desktopApp:createReleaseDistributable --stacktrace

      # Runs the packaged binary rather than the Gradle classpath: this is the
      # startup path that a packaging mistake actually breaks (see ADR 0007).
      - name: Smoke-test the packaged binary
        run: |
          desktopApp/build/compose/binaries/main-release/app/skyward/bin/skyward debug-matches \
            | tee /tmp/debug-matches.txt
          grep -q "occurrences in horizon" /tmp/debug-matches.txt

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          retention-days: 14
          if-no-files-found: ignore
