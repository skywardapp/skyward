name: Release on tag

# Builds the fossRelease APK plus a Linux desktop "flat pack" for a tag and
# publishes a GitHub Release with auto-generated notes and both attached.
# RELEASE.md ties F-Droid's build recipe to "the fossRelease build and this
# repo's tagged releases" — this is that half. playRelease is Play Console's
# job, not GitHub's, so it isn't built here.
#
# The flat pack is `createReleaseDistributable`'s jlinked app tree — the same
# one flatpak/build.sh repackages — tarred up as-is. No installer, no package
# manager: unpack it and run bin/skyward. It's a Linux x64 build (the runner
# this job builds on), same as the Deb/Rpm/Flatpak outputs already shipped
# with M6.
#
# The APK's own versionCode/versionName come from the tag being built, derived
# at build time by the version block in the root build.gradle.kts — which is
# why the checkout below needs tags present, not just the commit.
#
# Three ways in:
#   - `push: tags: v*` — push a tag yourself (`git tag vX.Y.Z && git push --tags`)
#     and this runs standalone.
#   - `workflow_call` — invoked directly as a job by auto-tag-main.yml, which
#     pushes its tag with the built-in GITHUB_TOKEN. GITHUB_TOKEN-authored
#     pushes are deliberately exempt from triggering further `on: push` runs
#     (GitHub's built-in loop guard), so that tag push never fires the trigger
#     above — hence the direct call, and hence no double publish.
#   - `workflow_dispatch` — manually run a release against an existing tag
#     that was pushed without one, e.g. because signing secrets were missing
#     at the time. GitHub's Immutable Releases (RELEASE.md) make a tag's
#     release permanent once published — assets can't be added, replaced or
#     removed afterwards — so this only helps a tag that never got a release
#     out; see "Create GitHub release" below for what happens if it did.

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: "Tag to release (defaults to the triggering ref)"
        required: false
        type: string
    # Declared so a caller can map just these rather than `secrets: inherit`.
    # `required: false` only keeps this schema-valid for a caller that omits
    # them (e.g. before the owner has generated the release key) — the job
    # itself now refuses to publish without all four, see "Require release
    # signing secrets" below.
    secrets:
      SKYWARD_RELEASE_STORE_FILE_BASE64:
        required: false
      SKYWARD_RELEASE_STORE_PASSWORD:
        required: false
      SKYWARD_RELEASE_KEY_ALIAS:
        required: false
      SKYWARD_RELEASE_KEY_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re-)release"
        required: true
        type: string

# Least privilege by default; the job below opts into write for the release.
permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish GitHub release
    runs-on: ubuntu-latest
    # Write is for creating the GitHub Release and uploading the APK to it.
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # This workflow also accepts hand-pushed tags and workflow_dispatch input,
      # so the tag here has not necessarily been through auto-tag-main's
      # arithmetic. Check it against the same bounded schema before building
      # anything: a tag outside it either fails the build later (the root
      # build.gradle.kts rejects it) or, worse, publishes a release whose
      # versionCode collides with another. `v*` also matches things like
      # v0.1.0-rc.1, which is a legitimate tag to push but not a release this
      # workflow should publish.
      - name: Validate the tag is a bounded stable release tag
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -qE '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Tag '$TAG' is not a stable vMAJOR.MINOR.PATCH tag — refusing to publish." >&2
            exit 1
          fi
          IFS='.' read -r major minor patch <<< "${TAG#v}"
          if [ "$((10#$major))" -gt 2100 ] || [ "$((10#$minor))" -gt 999 ] || [ "$((10#$patch))" -gt 999 ]; then
            echo "Tag '$TAG' has a component outside the versionCode encoding's range" >&2
            echo "(major <= 2100, minor/patch <= 999) — see the root build.gradle.kts." >&2
            exit 1
          fi
          if [ "$((10#$major))" -eq 0 ] && [ "$((10#$minor))" -eq 0 ] && [ "$((10#$patch))" -eq 0 ]; then
            echo "Tag 'v0.0.0' encodes to versionCode 0, but Android requires >= 1." >&2
            exit 1
          fi

      # The four SKYWARD_RELEASE_* secrets are individually optional (a caller
      # can supply none, and the build below falls back to a valid *unsigned*
      # APK — see build.gradle.kts) but an unsigned APK cannot be installed on
      # Android at all ("App not installed as package appears to be invalid").
      # That fallback exists so CI and local builds never break while the
      # owner's release key doesn't exist yet (RELEASE.md item 1) — it was
      # never meant to reach a public GitHub Release. Fail fast, before
      # spending any build time, rather than publishing another asset that
      # looks like a real release but can't be installed.
      - name: Require release signing secrets
        env:
          SKYWARD_RELEASE_STORE_FILE_BASE64: ${{ secrets.SKYWARD_RELEASE_STORE_FILE_BASE64 }}
          SKYWARD_RELEASE_STORE_PASSWORD: ${{ secrets.SKYWARD_RELEASE_STORE_PASSWORD }}
          SKYWARD_RELEASE_KEY_ALIAS: ${{ secrets.SKYWARD_RELEASE_KEY_ALIAS }}
          SKYWARD_RELEASE_KEY_PASSWORD: ${{ secrets.SKYWARD_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${SKYWARD_RELEASE_STORE_FILE_BASE64:-}" ] && missing+=(SKYWARD_RELEASE_STORE_FILE_BASE64)
          [ -z "${SKYWARD_RELEASE_STORE_PASSWORD:-}" ] && missing+=(SKYWARD_RELEASE_STORE_PASSWORD)
          [ -z "${SKYWARD_RELEASE_KEY_ALIAS:-}" ] && missing+=(SKYWARD_RELEASE_KEY_ALIAS)
          [ -z "${SKYWARD_RELEASE_KEY_PASSWORD:-}" ] && missing+=(SKYWARD_RELEASE_KEY_PASSWORD)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Refusing to publish tag '$TAG': missing repo secret(s) ${missing[*]}." >&2
            echo "Without them the fossRelease APK builds unsigned, and an unsigned APK" >&2
            echo "cannot be installed on Android — publishing it would only hand users a" >&2
            echo "broken download. Generate the release key and add these as repo secrets" >&2
            echo "first (RELEASE.md item 1), then re-run this workflow." >&2
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          # Full history and tags: the build derives its version via
          # `git describe`, which needs the tag object, not just the commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install Android SDK platform & build-tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          # `distributionSha256Sum` in gradle-wrapper.properties pins the Gradle
          # *distribution*; this checks the wrapper JAR that downloads and runs
          # it against Gradle's published hashes. Both are needed — the JAR is
          # committed to this repository and executes before any check here gets
          # a say, so a PR that quietly swapped it would otherwise run arbitrary
          # code on the runner. True is the action's own default; it is spelled
          # out so a future default flip can't drop the check silently.
          validate-wrappers: true

      # Optional: only present once the owner has generated the release key
      # (RELEASE.md item 1) and added it as repo secrets. Absent, the build
      # below falls back to an unsigned APK — same as CI, see build.gradle.kts.
      - name: Decode release signing key
        env:
          SKYWARD_RELEASE_STORE_FILE_BASE64: ${{ secrets.SKYWARD_RELEASE_STORE_FILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${SKYWARD_RELEASE_STORE_FILE_BASE64:-}" ]; then
            printf '%s' "$SKYWARD_RELEASE_STORE_FILE_BASE64" | base64 -d > "${RUNNER_TEMP}/skyward-release.jks"
            echo "SKYWARD_RELEASE_STORE_FILE=${RUNNER_TEMP}/skyward-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Assemble fossRelease APK
        env:
          SKYWARD_RELEASE_STORE_PASSWORD: ${{ secrets.SKYWARD_RELEASE_STORE_PASSWORD }}
          SKYWARD_RELEASE_KEY_ALIAS: ${{ secrets.SKYWARD_RELEASE_KEY_ALIAS }}
          SKYWARD_RELEASE_KEY_PASSWORD: ${{ secrets.SKYWARD_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleFossRelease --stacktrace

      # Renamed on the way out so the release asset is self-describing —
      # AGP's default output name (androidApp-foss-release.apk) carries no
      # version. Only the uploaded copy is renamed; the built artifact the
      # reproducibility check compares is untouched.
      - name: Stage the APK as a release asset
        id: apk
        run: |
          set -euo pipefail
          built=$(find androidApp/build/outputs/apk/foss/release -name '*.apk' -print -quit)
          if [ -z "$built" ]; then
            echo "No APK found under androidApp/build/outputs/apk/foss/release" >&2
            exit 1
          fi
          asset="${RUNNER_TEMP}/skyward-${TAG}-foss.apk"
          cp "$built" "$asset"
          echo "path=$asset" >> "$GITHUB_OUTPUT"

      # Same tree flatpak/build.sh repackages (see comment at the top of this
      # file); building it here doesn't need the Android signing key itself,
      # but any Gradle invocation configures the whole multi-project build,
      # including androidApp/build.gradle.kts — which now rejects a *partial*
      # signing config (see that file's "all four or none" check). STORE_FILE
      # is already visible here via GITHUB_ENV (set in "Decode release signing
      # key" above); the other three must be repeated here too, or this step
      # trips that check with only storeFile set.
      - name: Build desktop distributable
        env:
          SKYWARD_RELEASE_STORE_PASSWORD: ${{ secrets.SKYWARD_RELEASE_STORE_PASSWORD }}
          SKYWARD_RELEASE_KEY_ALIAS: ${{ secrets.SKYWARD_RELEASE_KEY_ALIAS }}
          SKYWARD_RELEASE_KEY_PASSWORD: ${{ secrets.SKYWARD_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :desktopApp:createReleaseDistributable --stacktrace

      # Same check ci.yml's `check` job runs on every push (see ADR 0007): a
      # missing jlink module compiles fine and only breaks at first launch,
      # so this is what actually catches a bad packaging config — worth
      # repeating here since this binary is the one about to ship.
      - name: Smoke-test the packaged binary
        run: |
          set -euo pipefail
          desktopApp/build/compose/binaries/main-release/app/skyward/bin/skyward debug-matches \
            | tee /tmp/debug-matches.txt
          grep -q "occurrences in horizon" /tmp/debug-matches.txt

      # Tarred as-is, no jpackage installer wrapper — that's what makes it a
      # "flat pack": unpack and run bin/skyward, no package manager involved.
      # Re-runs the same smoke test against the *extracted* archive, not just
      # the source tree, so a tar/permissions mistake in this step itself
      # (e.g. losing the executable bit) fails here instead of shipping.
      - name: Stage the flat pack as a release asset
        id: flatpack
        run: |
          set -euo pipefail
          tree="desktopApp/build/compose/binaries/main-release/app/skyward"
          if [ ! -x "$tree/bin/skyward" ]; then
            echo "expected an executable launcher at $tree/bin/skyward — did createReleaseDistributable change its output layout?" >&2
            exit 1
          fi
          asset="${RUNNER_TEMP}/skyward-${TAG}-linux-x64.tar.gz"
          tar -C "$(dirname "$tree")" -czf "$asset" "$(basename "$tree")"

          extract_dir="${RUNNER_TEMP}/flatpack-verify"
          mkdir -p "$extract_dir"
          tar -xzf "$asset" -C "$extract_dir"
          extracted="$extract_dir/$(basename "$tree")/bin/skyward"
          if [ ! -x "$extracted" ]; then
            echo "extracted archive is missing an executable bin/skyward — refusing to publish" >&2
            exit 1
          fi
          "$extracted" debug-matches | tee /tmp/debug-matches-extracted.txt
          grep -q "occurrences in horizon" /tmp/debug-matches-extracted.txt

          echo "path=$asset" >> "$GITHUB_OUTPUT"

      # gh (pre-installed on GitHub-hosted runners) rather than a third-party
      # release action — one less external action to trust/pin. --generate-notes
      # asks GitHub to build categorized notes from merged PRs since the
      # previous release, same as the "Generate release notes" button in the UI.
      #
      # This only ever creates. Once Immutable Releases is on for this repo
      # (RELEASE.md), a published release's tag and assets are permanent —
      # `gh release upload --clobber` against one fails outright, and even
      # unenabled, silently overwriting a previously published release's
      # assets is exactly the tampering surface that setting exists to close.
      # So a tag that already has a release is refused here rather than
      # patched: cut a new tag instead of re-running this workflow against
      # one that already published. `gh release create` uploads every asset
      # before the release goes live (a draft under the hood), which is the
      # sequencing Immutable Releases requires — nothing extra to do for it.
      #
      # --verify-tag matters here specifically because the release becomes
      # permanent the moment it publishes: without it, `gh release create`
      # silently creates a *new* tag off the default branch if `$TAG` isn't
      # found on the remote (e.g. deleted between the checkout above and this
      # step), so the published release would point at the wrong commit —
      # with no way to fix it afterwards. Fail instead of guessing.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.path }}
          FLATPACK: ${{ steps.flatpack.outputs.path }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release '$TAG' already exists. Releases are immutable —" >&2
            echo "refusing to add, replace or remove its assets. Cut a new" >&2
            echo "tag instead of re-running this workflow against one that" >&2
            echo "already published." >&2
            exit 1
          fi
          gh release create "$TAG" "$APK" "$FLATPACK" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes
