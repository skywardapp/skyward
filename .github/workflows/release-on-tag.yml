name: Release on tag

# Builds the fossRelease APK for a tag and publishes a GitHub Release with
# auto-generated notes and the APK attached. RELEASE.md ties F-Droid's build
# recipe to "the fossRelease build and this repo's tagged releases" — this is
# that half. playRelease is Play Console's job, not GitHub's, so it isn't
# built here.
#
# Two ways in:
#   - `push: tags: v*` — push a tag yourself (`git tag vX.Y.Z && git push --tags`)
#     and this runs standalone.
#   - `workflow_call` — invoked directly as a job by auto-tag-main.yml, which
#     pushes its own tag using the default GITHUB_TOKEN. GITHUB_TOKEN-authored
#     pushes are deliberately exempt from triggering further `on: push` runs
#     (GitHub's built-in loop guard), so that tag push would never fire the
#     trigger above — hence the direct call instead.
# `workflow_dispatch` is for manually (re-)running a release against an
# existing tag, e.g. after fixing a signing secret.

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: "Tag to release (defaults to the triggering ref)"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re-)release"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: resolve
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.tag }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform & build-tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Optional: only present once the owner has generated the release key
      # (RELEASE.md item 1) and added it as repo secrets. Absent, the build
      # below falls back to an unsigned APK — same as CI, see build.gradle.kts.
      - name: Decode release signing key
        if: ${{ secrets.SKYWARD_RELEASE_STORE_FILE_BASE64 != '' }}
        run: |
          echo "${{ secrets.SKYWARD_RELEASE_STORE_FILE_BASE64 }}" | base64 -d > "${RUNNER_TEMP}/skyward-release.jks"
          echo "SKYWARD_RELEASE_STORE_FILE=${RUNNER_TEMP}/skyward-release.jks" >> "$GITHUB_ENV"

      - name: Assemble fossRelease APK
        env:
          SKYWARD_RELEASE_STORE_PASSWORD: ${{ secrets.SKYWARD_RELEASE_STORE_PASSWORD }}
          SKYWARD_RELEASE_KEY_ALIAS: ${{ secrets.SKYWARD_RELEASE_KEY_ALIAS }}
          SKYWARD_RELEASE_KEY_PASSWORD: ${{ secrets.SKYWARD_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleFossRelease --stacktrace

      - name: Locate fossRelease APK
        id: apk
        run: |
          set -euo pipefail
          path=$(find androidApp/build/outputs/apk/foss/release -name '*.apk' -print -quit)
          if [ -z "$path" ]; then
            echo "No APK found under androidApp/build/outputs/apk/foss/release" >&2
            exit 1
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"

      # gh (pre-installed on GitHub-hosted runners) rather than a third-party
      # release action — one less external action to trust/pin. --generate-notes
      # asks GitHub to build categorized notes from merged PRs since the
      # previous release, same as the "Generate release notes" button in the UI.
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.resolve.outputs.tag }}"
          apk="${{ steps.apk.outputs.path }}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$tag" "$apk" \
              --repo "${{ github.repository }}" \
              --title "$tag" \
              --generate-notes
          fi
