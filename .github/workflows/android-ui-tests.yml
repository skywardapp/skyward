name: Android UI tests

# §17.5's Android instrumented smoke tests, on an emulator, with the screen
# recorded. The video is the point as much as the pass/fail is: connected-test
# failures (a dialog that stole focus, a permission prompt, a frame that never
# settled) are near-impossible to diagnose from a stack trace alone, and there
# is no device to look at afterwards.
#
# Kept out of ci.yml deliberately — booting an emulator costs ~10× a `check`
# run, so it gets its own concurrency group and timeout and can be skipped or
# scheduled independently if it ever becomes the slow path.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ui-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  instrumented:
    name: Instrumented UI tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # minSdk is 26 and targetSdk 36; API 30 is the cheap, historically
        # stable emulator image. Add further levels here as the UI grows —
        # each entry is a full extra emulator boot, so add deliberately.
        api-level: [30]
    env:
      EMULATOR_TARGET: google_apis
      EMULATOR_ARCH: x86_64

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # This job runs PR-controlled Gradle and shell code, and nothing in it
          # does an authenticated Git operation — so the checkout token has no
          # reason to stay on disk for that code to find.
          persist-credentials: false

      # Hardware acceleration: without this the emulator falls back to software
      # and the job takes long enough to hit the timeout.
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ubuntu-24.04 dropped the preinstalled ffmpeg that earlier runner images
      # had. Without it, any flavour whose run outlives one 170 s screenrecord
      # segment ships as loose segment files instead of one video — which is
      # every flavour that has to build and install before testing. The
      # recorder degrades gracefully without ffmpeg, so a failure here must not
      # take a green test run down with it.
      #
      # apt's ffmpeg pulls ~90 packages (libsdl2, pulseaudio, jack, pocketsphinx,
      # openal...) we don't need just to concat two video segments, and one run
      # hit a throttled azure.archive.ubuntu.com mirror that took 30 minutes to
      # serve those 63 MB (github.com/skywardapp/skyward/actions/runs/31796936329).
      # Caching the fetched .debs sidesteps the mirror on repeat runs, and the
      # timeout bounds the damage on a genuinely bad mirror day to minutes
      # instead of eating half the job's 60-minute budget.
      #
      # Split restore/save (rather than the combined actions/cache@v4 action)
      # because the save half of that action only runs post-job on success —
      # and the emulator boot after this is flaky enough that a run which
      # downloaded the debs fine would still often fail to cache them.
      - name: Restore apt packages for ffmpeg
        id: apt-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-ffmpeg-${{ runner.os }}-noble-v1

      - name: Install ffmpeg (stitches the video segments)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Save apt packages for ffmpeg
        if: always() && !cancelled() && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-ffmpeg-${{ runner.os }}-noble-v1

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          # `distributionSha256Sum` in gradle-wrapper.properties pins the Gradle
          # *distribution*; this checks the wrapper JAR that downloads and runs
          # it against Gradle's published hashes. Both are needed — the JAR is
          # committed to this repository and executes before any check here gets
          # a say, so a PR that quietly swapped it would otherwise run arbitrary
          # code on the runner. True is the action's own default; it is spelled
          # out so a future default flip can't drop the check silently.
          validate-wrappers: true

      # DO NOT re-add an AVD snapshot cache here. It looks like free wall-clock
      # (a cached `default_boot` snapshot resumes in ~1 s instead of booting for
      # ~60 s) and it wedged this job completely for half a day on 2026-08-14.
      #
      # Restoring a quick-boot snapshot brings back a RAM image in which
      # `sys.boot_completed` is *already* 1, so the runner action's
      # `waitForDevice()` returns about two seconds after `Loading snapshot`,
      # while the guest has not finished re-registering its system services. The
      # action then unconditionally sends a wake keyevent — before, not as part
      # of, `disable-animations` — and dies:
      #
      #   Successfully loaded snapshot 'default_boot' using 1141 ms
      #   adb -s emulator-5554 shell input keyevent 82
      #   java.lang.IllegalStateException: ...ServiceNotFoundException:
      #     No service published for: input
      #
      # That is deterministic on a cache hit, and it happens inside the action,
      # before run-ui-tests.sh gets to run — so the job fails in under a minute
      # with no video, no logcat and no test report to explain itself.
      #
      # What makes it a trap rather than a nuisance: actions/cache only writes
      # its entry post-job *on success*, and the key was fixed with no salt. So
      # exactly one passing run ever populated it, that entry then failed every
      # subsequent run, and no run could pass to replace it. Re-running is not a
      # workaround, and rotating the key is not a fix either — the first green
      # run just re-poisons it. Five retries on #9 were doomed before they
      # started.
      #
      # Cold-booting is also cheaper than it looks: the cache-miss path booted
      # the emulator twice (once to seed the snapshot, once to test) and shipped
      # ~1.1 GB each way. One cold boot beats that.
      - name: Run instrumented UI tests (both flavours, screen recorded)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          force-avd-creation: false
          # -no-snapshot, not -no-snapshot-save: quick-boot must neither load
          # nor save. See the comment above before changing this.
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: tools/ci/run-ui-tests.sh

      # Uploaded on failure AND on success: the passing video is the baseline
      # you compare the next failing one against.
      - name: Upload screen recordings and logcat
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-test-video-api${{ matrix.api-level }}
          path: build/ui-test-video/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instrumented-test-reports-api${{ matrix.api-level }}
          path: |
            androidApp/build/reports/androidTests/
            androidApp/build/outputs/androidTest-results/
          retention-days: 14
          if-no-files-found: ignore
